[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictflow"
version = "0.1.0"
description = "Official Python SDK for PredictFlow - demand forecasting, inventory intelligence, and pricing optimization for Shopify and WooCommerce stores"
readme = "README.md"
license = "MIT"
authors = [{ name = "PredictFlow", url = "https://predictflow.co" }]
requires-python = ">=3.9"
keywords = [
    "predictflow",
    "demand-forecasting",
    "inventory-intelligence",
    "ecommerce-analytics",
    "sdk",
    "api-client",
    "rest-api",
    "shopify",
    "woocommerce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.urls]
Homepage = "https://predictflow.co"
Repository = "https://github.com/PredictFlow/python-sdk"
Issues = "https://github.com/PredictFlow/python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predictflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# mypy itself no longer checks against targets below 3.10, but the
# package still supports 3.9 at runtime - from __future__ import
# annotations (used everywhere) makes the `X | Y` union syntax in type
# hints safe there since annotations are never eagerly evaluated.
python_version = "3.10"
strict = true
packages = ["predictflow"]
# Response bodies are deliberately untyped (Any) in v0.1 - every resource
# method's return-type annotation documents the expected shape, but
# nothing validates the actual JSON against it (no pydantic dependency by
# design). warn_return_any would flag every single resource method for
# this on-purpose choice; see README's "Typing" section for the tradeoff.
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
