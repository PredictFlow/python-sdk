name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      # mypy targets python_version = "3.10" in pyproject.toml regardless
      # of the matrix leg - it's a static-analysis setting, not tied to
      # which interpreter runs the check, and only needs to run once.
      - if: matrix.python-version == '3.11'
        run: mypy src/predictflow
